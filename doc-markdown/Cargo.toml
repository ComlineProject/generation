[package]
name = "comline-doc-markdown"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The official Comline documentation renderer: a documentation model in, Markdown pages out."

[dependencies]
comline-codegen = { path = "../codegen" }
eyre = "0.6.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "comline-doc-markdown"
path = "src/bin/comline-doc-markdown.rs"
