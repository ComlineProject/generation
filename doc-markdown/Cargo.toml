[package]
name = "comline-doc-markdown"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The official Comline documentation renderer: a documentation model in, Markdown pages out."

[dependencies]
comline-codegen = { path = "../codegen" }
# The IR only, as `comline-codegen` takes it: guarantee names and their
# prose. Same rev as `comline-codegen`'s.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "076cae0c3a0639b0c083b61a94f9d4913e853b3f", default-features = false }
eyre = "0.6.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "comline-doc-markdown"
path = "src/bin/comline-doc-markdown.rs"
