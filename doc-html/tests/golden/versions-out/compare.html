<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare versions · shop</title>
<script>try{var t=localStorage.getItem("comline-doc-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
<a class="brand" href="index.html">shop</a>
<nav class="site-links" aria-label="Site"><a href="compare.html">Compare versions</a></nav>
<button type="button" class="theme" id="theme-toggle" aria-label="Theme: auto. Switch to light" hidden>◐ Auto</button>
</header>
<main class="wide">
<h1>Compare versions</h1>
<p>Choose two versions to see what changed between them, or more for every unit and member side by side. The labels are the changelogs core computed between each version and the one before it.</p>
<fieldset class="choose">
<legend>Versions</legend>
<div id="choices"></div>
</fieldset>
<div id="comparison" aria-live="polite"><p>This page needs JavaScript.</p></div>
</main>
<script src="compare.js"></script>
<script>
/* The theme toggle: auto (the system's setting), light, dark. The choice is
   kept in localStorage when the browser allows it; the inline script in
   <head> applies it before the page paints. */
(function () {
  var KEY = "comline-doc-theme";
  var ORDER = ["auto", "light", "dark"];
  var ICON = { auto: "◐", light: "☀", dark: "☾" };
  var root = document.documentElement;
  var button = document.getElementById("theme-toggle");
  if (!button) return;
  function apply(theme) {
    if (theme === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", theme);
    var next = ORDER[(ORDER.indexOf(theme) + 1) % ORDER.length];
    var name = theme.charAt(0).toUpperCase() + theme.slice(1);
    button.textContent = ICON[theme] + " " + name;
    button.setAttribute("aria-label", "Theme: " + theme + ". Switch to " + next);
    button.title = "Theme: " + theme + " (switch to " + next + ")";
    button.setAttribute("data-theme-choice", theme);
  }
  button.addEventListener("click", function () {
    var now = button.getAttribute("data-theme-choice") || "auto";
    var next = ORDER[(ORDER.indexOf(now) + 1) % ORDER.length];
    try {
      if (next === "auto") localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, next);
    } catch (e) {}
    apply(next);
  });
  apply(root.getAttribute("data-theme") || "auto");
  button.hidden = false;
})();
</script>
</body>
</html>
