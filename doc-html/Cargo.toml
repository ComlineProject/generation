[package]
name = "comline-doc-html"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The official Comline HTML documentation renderer: a documentation model in, a static site out."

[dependencies]
comline-codegen = { path = "../codegen" }
eyre = "0.6.8"
serde_json = "1.0"
# Doc text is Markdown. Pure Rust, so it builds for wasm32-wasip1; exact pin,
# so the golden pages (and the CLI's built-in output) don't drift with it.
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }

[[bin]]
name = "comline-doc-html"
path = "src/bin/comline-doc-html.rs"
