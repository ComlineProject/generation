[package]
name = "comline-codelib-gen-lua"
version = "0.1.0"
edition = "2021"


[dependencies]
# Interim: track `core` by git rev until it cuts a fresh `comline-core`
# release. The generators pattern-match the current `FrozenUnit`; the
# published 0.1.0 is pre-audit. Local iteration: uncomment the
# workspace-root [patch] onto a sibling checkout.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "aa84d970d3295df59cc3e620bdb71bf96382f97b" }
comline-codelib-gen = { path = "../_core" }

mlua =  { version = "0.9.2", features = ["lua51", "module"] }
eyre = "0.6.11"
once_cell = "1.18.0"

