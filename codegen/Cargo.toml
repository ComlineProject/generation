[package]
name = "comline-codegen"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
# Interim: track `core` by git rev (see design/runtime-repo-structure.md — no
# crates.io publishing at this stage). Local iteration: uncomment the
# workspace-root [patch] onto a sibling checkout.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "f6e289aaa137258e9e96c378c32d057c249a5b5d" }

eyre = "0.6.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
