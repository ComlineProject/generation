[package]
name = "comline-conformance"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The codegen conformance corpus: canonical `FrozenUnit` fixtures + golden
# generated output per target language. Catches generator drift and
# cross-language inconsistency, especially as the per-language generators move
# to their own repos. See design/runtime-repo-structure.md (rollout step 3).

[dependencies]
comline-core = { git = "https://github.com/ComlineProject/core", rev = "98d64faedfc48ab4d2c93722e2b099debedd503c" }
# Not dev-only: a `Fixture` states the `Mode` it exercises, so the contract
# types are part of the corpus's own public shape.
comline-codegen = { path = "../codegen" }

[dev-dependencies]
eyre = "0.6.8"
serde_json = "1.0"
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "9690a1871869f4520c45d4f83a1485e23b20261c" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "ead97d39a67699a43d1b46ee8c082bbd04f9d53c" }
