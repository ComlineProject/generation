[package]
name = "comline-conformance"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The codegen conformance corpus: canonical `FrozenUnit` fixtures + golden
# generated output per target language. Catches generator drift and
# cross-language inconsistency, especially as the per-language generators move
# to their own repos. See design/runtime-repo-structure.md (rollout step 3).

[dependencies]
comline-core = { git = "https://github.com/ComlineProject/core", rev = "f8861a8716ff597e8623ce0b3f067eda0ea1923b" }

[dev-dependencies]
comline-codegen = { path = "../codegen" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "9366ea18b706aed357c3c745f239c32797048780" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "132630a7d61ec7a2c6425b50bce716098befe617" }
