[package]
name = "comline-conformance"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The codegen conformance corpus: canonical `FrozenUnit` fixtures + golden
# generated output per target language. Catches generator drift and
# cross-language inconsistency, especially as the per-language generators move
# to their own repos. See design/runtime-repo-structure.md (rollout step 3).

[dependencies]
comline-core = { git = "https://github.com/ComlineProject/core", rev = "f6e289aaa137258e9e96c378c32d057c249a5b5d" }
# Not dev-only: a `Fixture` states the `Mode` it exercises, so the contract
# types are part of the corpus's own public shape.
comline-codegen = { path = "../codegen" }

[dev-dependencies]
eyre = "0.6.8"
serde_json = "1.0"
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "d7977a9e81060c4ad9dbe77285141fc40a124c39" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "f57e17c7e379d2cbaffa400dd8f9284b4a242792" }
