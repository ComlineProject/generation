[package]
name = "comline-conformance"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The codegen conformance corpus: canonical `FrozenUnit` fixtures + golden
# generated output per target language. Catches generator drift and
# cross-language inconsistency, especially as the per-language generators move
# to their own repos. See design/runtime-repo-structure.md (rollout step 3).

[dependencies]
comline-core = { git = "https://github.com/ComlineProject/core", rev = "622500a39a49ad4118cdce9344531cf6f0f5978d" }
# Not dev-only: a `Fixture` states the `Mode` it exercises, so the contract
# types are part of the corpus's own public shape.
comline-codegen = { path = "../codegen" }

[dev-dependencies]
eyre = "0.6.8"
serde_json = "1.0"
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "bc1c4af956bfad9e110583620e6f85255a0dda42" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "4ad1c3574a342d974e83a94570d51d903ea32bbe" }
