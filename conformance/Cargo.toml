[package]
name = "comline-conformance"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The codegen conformance corpus: canonical `FrozenUnit` fixtures + golden
# generated output per target language. Catches generator drift and
# cross-language inconsistency, especially as the per-language generators move
# to their own repos. See design/runtime-repo-structure.md (rollout step 3).

[dependencies]
comline-core = { git = "https://github.com/ComlineProject/core", rev = "16b6e305ad663c376ae8062bb510713d441ae5e0" }

[dev-dependencies]
comline-codegen = { path = "../codegen" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "1bb42f0b37cda16752d4c69aaa6e378642af1e2a" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "a7be9e93fb424c106f6698e005e6e924935b00b6" }
