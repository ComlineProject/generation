[package]
name = "comline-conformance"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The codegen conformance corpus: canonical `FrozenUnit` fixtures, and the
# generator-agnostic harness that runs a generator over them and checks its
# golden output. The per-language generators live in their own repos and
# depend on this crate - never the other way, so a core change is pinned here
# first and then in each generator, with no round back. See
# design/runtime-repo-structure.md (rollout step 3).

[dependencies]
comline-core = { git = "https://github.com/ComlineProject/core", rev = "69039e7ab05953760bb7a6818f61e98c14b43922" }
# Not dev-only: a `Fixture` states the `Mode` it exercises, so the contract
# types are part of the corpus's own public shape.
comline-codegen = { path = "../codegen" }
# The harness's own: a generator's entry point returns `eyre::Result`, and the
# feature report is JSON.
eyre = "0.6.8"
serde_json = "1.0"
