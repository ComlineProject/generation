[package]
name = "comline-conformance"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The codegen conformance corpus: canonical `FrozenUnit` fixtures + golden
# generated output per target language. Catches generator drift and
# cross-language inconsistency, especially as the per-language generators move
# to their own repos. See design/runtime-repo-structure.md (rollout step 3).

[dependencies]
comline-core = { git = "https://github.com/ComlineProject/core", rev = "5e6cc3af04964590b43c3c53f8924f474f00951e" }

[dev-dependencies]
comline-codegen = { path = "../codegen" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "6b3f4ffd027b37219efa36e167f769e7362821cc" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "56bea641f6d163120006e853bff4eec4d0a7c88e" }
