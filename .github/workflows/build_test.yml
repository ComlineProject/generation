name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # TODO(de-rot G1): drop `continue-on-error` once the generators are ported
      # off the pre-audit IR (see design/generation.md in the docs repo). After
      # G0 the workspace resolves and the manifests are clean; the crate bodies
      # still pattern-match an older `FrozenUnit`.
      - run: cargo build --verbose
        continue-on-error: true
      - run: cargo test --verbose
        continue-on-error: true
