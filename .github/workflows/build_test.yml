name: Cargo Build & Test

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; a branch's runs
# queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The toolchain matrix (stable, beta, nightly), the same build and tests on
  # the other platforms (core#9: paths and line endings are where they're
  # expected to differ), and a stable canary on ubuntu-26.04 that may fail
  # without failing the run. The reusable workflow's own jobs set the runner,
  # the timeouts and the pinned actions.
  rust:
    name: rust
    permissions:
      contents: read
    uses: ComlineProject/.github/.github/workflows/rust-ci.yml@807dd25bcbf848275f5f2bc5dcdd15070dcc321b # main, no release tag yet

  # `comline-codegen` takes core's IR only, with no parser, so it (and so a
  # generator binary) builds for WASI and the browser. In the wasm CI image
  # (stable 1.99.1, which `rust-toolchain.toml` pins, and both wasm targets).
  wasm:
    name: comline-codegen - wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/comlineproject/ci-wasm@sha256:badd6af13cee6c459c9284de8ef0ef4a1667ed7e35582f87d1afb08f3c30fd8f
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --verbose -p comline-codegen --target wasm32-wasip1
      - run: cargo build --verbose -p comline-codegen --target wasm32-unknown-unknown
      # The Markdown renderer as a WASI module, which the CLI can run under
      # wasmtime like a generator.
      - run: cargo build --verbose -p comline-doc-markdown --bin comline-doc-markdown --target wasm32-wasip1
      # The HTML renderer, the same way.
      - run: cargo build --verbose -p comline-doc-html --bin comline-doc-html --target wasm32-wasip1
